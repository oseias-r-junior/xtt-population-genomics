name: xtt_genomad

channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:

  ###########################################################################
  # Core
  ###########################################################################

  - pip

  ###########################################################################
  # geNomad
  ###########################################################################

  - genomad=1.12.0

  ###########################################################################
  # Utilities
  ###########################################################################

  - seqkit
  - pigz
  - parallel

  ###########################################################################
  # Python packages used throughout the XTT pipeline
  ###########################################################################

  - biopython
  - pandas
  - numpy

  - pip:
      - pyyaml