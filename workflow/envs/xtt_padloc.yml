name: xtt_padloc

channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:

  # ------------------------------------------------------------------
  # Core
  # ------------------------------------------------------------------
  - pip

  # ------------------------------------------------------------------
  # PADLOC
  # ------------------------------------------------------------------
  - padloc=2.0.0

  # ------------------------------------------------------------------
  # External dependencies
  # ------------------------------------------------------------------
  - hmmer
  - prodigal
  - blast
  - minced

  # ------------------------------------------------------------------
  # Useful utilities
  # ------------------------------------------------------------------
  - seqkit
  - parallel
  - pigz

  # ------------------------------------------------------------------
  # Python packages
  # ------------------------------------------------------------------
  - biopython
  - pandas
  - numpy

  - pip:
      - pyyaml